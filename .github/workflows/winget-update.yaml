name: Automated WinGet update

# The manifests reach microsoft/winget-pkgs through the fork
# freelensapp/winget-pkgs. This repository holds only the templates and the
# tooling, so that nothing here, Renovate included, clones the history of
# winget-pkgs. The fork is checked out shallow, without blobs, and sparse:
# the top commit of its master and the manifests of Freelens only.
on:
  issue_comment:
    types:
      - created
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  winget-update:
    name: WinGet update

    runs-on: ubuntu-24.04-arm
    environment: automated
    timeout-minutes: 15

    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, '/rerun')

    env:
      DO_NOT_TRACK: "1"
      FORK: freelensapp/winget-pkgs
      UPSTREAM: microsoft/winget-pkgs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # mise-action adds --locked on its own when a lockfile is present, so
      # yq and yamlfmt are verified against mise.lock.
      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.19 # datasource=github-releases depName=jdx/mise

      - name: Set version
        run: |
          echo "version=$(yq -r '.freelens' .versions.yaml)" | tee -a "$GITHUB_ENV"

      # The master of the fork is brought up to the upstream one through the
      # API, without a clone. The version branch is committed on top of it, so
      # its parent is a commit the fork already has, which a push from a
      # shallow clone needs.
      - name: Sync the master branch of the fork
        run: gh repo sync "$FORK" --branch master
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Checkout the master branch of the fork
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FORK }}
          ref: master
          token: ${{ secrets.GH_TOKEN }}
          path: winget-pkgs
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: manifests/f/Freelensapp/Freelens

      - name: Check if version already exists
        run: |
          if [[ -d winget-pkgs/manifests/f/Freelensapp/Freelens/${version} ]]; then
            echo "pr_type=Update" | tee -a "$GITHUB_ENV"
          else
            echo "pr_type=New version" | tee -a "$GITHUB_ENV"
          fi

      # make.sh writes to manifests/ of the working directory, which points
      # into the checkout of the fork.
      - name: Generate new manifests
        run: |
          ln -s winget-pkgs/manifests manifests
          bash -x make.sh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Check for changes
        run: |
          if [[ -n "$(git -C winget-pkgs status --porcelain)" ]]; then
            echo "changes=true" | tee -a "$GITHUB_ENV"
          else
            echo "changes=false" | tee -a "$GITHUB_ENV"
          fi

      - name: Commit and push to branch
        if: env.changes == 'true'
        uses: EndBug/add-and-commit@v11
        with:
          cwd: winget-pkgs
          github_token: ${{ secrets.GH_TOKEN }}
          default_author: github_actions
          add: manifests/f/Freelensapp/Freelens
          message: "${{ env.pr_type }}: Freelensapp.Freelens version ${{ env.version }}"
          new_branch: Freelensapp-Freelens-${{ env.version }}
          fetch: false
          push: origin Freelensapp-Freelens-${{ env.version }} --set-upstream --force

      - name: Create pull request
        if: env.changes == 'true'
        run: |-
          if [[ $(gh pr view \
            --repo "$UPSTREAM" \
            --json state \
            --jq .state \
            "freelensapp:Freelensapp-Freelens-${version}" || true) != "OPEN" ]];
          then
            gh pr create \
              --repo "$UPSTREAM" \
              --base master \
              --head "freelensapp:Freelensapp-Freelens-${version}" \
              --title "${pr_type}: Freelensapp.Freelens version ${version}" \
              --body "This PR updates the WinGet manifest for Freelensapp.Freelens version ${version}."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
